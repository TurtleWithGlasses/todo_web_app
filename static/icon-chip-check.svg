<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Task app icon: a checkmark inside a silicon chip">
  <defs>
    <linearGradient id="ch-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ch-check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="#0B1224"/>

  <!-- chip pins -->
  <g fill="url(#ch-edge)">
    <rect x="164" y="72" width="26" height="52" rx="13"/>
    <rect x="243" y="72" width="26" height="52" rx="13"/>
    <rect x="322" y="72" width="26" height="52" rx="13"/>

    <rect x="164" y="388" width="26" height="52" rx="13"/>
    <rect x="243" y="388" width="26" height="52" rx="13"/>
    <rect x="322" y="388" width="26" height="52" rx="13"/>

    <rect x="72" y="164" width="52" height="26" rx="13"/>
    <rect x="72" y="243" width="52" height="26" rx="13"/>
    <rect x="72" y="322" width="52" height="26" rx="13"/>

    <rect x="388" y="164" width="52" height="26" rx="13"/>
    <rect x="388" y="243" width="52" height="26" rx="13"/>
    <rect x="388" y="322" width="52" height="26" rx="13"/>
  </g>

  <!-- chip body -->
  <rect x="110" y="110" width="292" height="292" rx="68" fill="#141F3D" stroke="url(#ch-edge)" stroke-width="11"/>

  <!-- check -->
  <path d="M182 262 L236 316 L338 202" fill="none" stroke="url(#ch-check)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
