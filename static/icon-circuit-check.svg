<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Task app icon: a checkmark drawn as a circuit trace">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.52" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="cc-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#cc-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#cc-sheen)"/>

  <!-- circuit traces running off toward the edges -->
  <g stroke="#E0F2FE" stroke-opacity="0.42" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M60 268 H140"/>
    <path d="M372 188 V92"/>
    <path d="M216 344 V430"/>
  </g>
  <g fill="#E0F2FE" fill-opacity="0.42">
    <circle cx="60" cy="268" r="11"/>
    <circle cx="372" cy="92" r="11"/>
    <circle cx="216" cy="430" r="11"/>
  </g>

  <!-- the check itself -->
  <path d="M140 268 L216 344 L372 188" fill="none" stroke="#FFFFFF" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulse ring on the completed end -->
  <circle cx="372" cy="188" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"/>

  <!-- terminal nodes -->
  <circle cx="140" cy="268" r="36" fill="#FFFFFF"/>
  <circle cx="140" cy="268" r="15" fill="#4C1D95"/>
  <circle cx="372" cy="188" r="36" fill="#FFFFFF"/>
  <circle cx="372" cy="188" r="15" fill="#06B6D4"/>
</svg>
