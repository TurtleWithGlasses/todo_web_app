<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Work Organizer</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <script>
    (function () {
      var t = localStorage.getItem('appTheme');
      if (t && t !== 'classic') document.documentElement.setAttribute('data-theme', t);
      var b = localStorage.getItem('appBgMode');
      if (b && b !== 'dark') document.documentElement.setAttribute('data-bg', b);
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .month-nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 18px 0 8px;
    }
    .month-nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .month-nav-btn:hover:not(:disabled) { background: var(--bg-card-hover); }
    .month-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .month-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 160px;
      text-align: center;
    }

    /* ── Task history panel ─────────────────────────────── */
    .tf-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .tf-overlay.open { opacity: 1; pointer-events: all; }
    .tf-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      width: 560px; max-width: 94vw; max-height: 86vh;
      display: flex; flex-direction: column;
      transform: translateY(18px) scale(.97);
      transition: transform .25s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .tf-overlay.open .tf-panel { transform: translateY(0) scale(1); }

    .tf-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); line-height: 1.35; }
    .tf-sum { margin-top: 7px; font-size: .8rem; color: var(--text-muted); }
    .tf-sum strong { color: var(--text-primary); }

    .tf-sec {
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted);
      margin: 18px 0 4px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .tf-scroll { overflow-y: auto; flex: 1; min-height: 0; }

    .tf-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 9px;
      cursor: pointer; transition: background .15s;
    }
    .tf-row:hover { background: var(--bg-card); }
    .tf-row.current { background: var(--bg-card); box-shadow: inset 3px 0 0 var(--accent); padding-left: 15px; }
    .tf-month {
      font-size: .84rem; color: var(--text-primary);
      min-width: 130px; font-variant-numeric: tabular-nums;
    }
    .tf-flags { display: flex; gap: 8px; margin-left: auto; }
    .tf-flag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .72rem; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-muted);
      white-space: nowrap;
    }
    .tf-flag.on { color: var(--success); border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.10); }
    .tf-hint { color: var(--text-muted); font-size: .84rem; padding: 20px 4px; text-align: center; }

    .tf-foot { display: flex; justify-content: flex-end; margin-top: 16px; }
    .tf-close {
      padding: 9px 18px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text-secondary); font-family: 'Outfit', sans-serif;
      font-size: .85rem; cursor: pointer; transition: all .15s;
    }
    .tf-close:hover { color: var(--text-primary); background: var(--bg-card-hover); }

    .tf-acts { margin-top: 4px; }
    .tf-act-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .tf-act-row select, .tf-act-row input {
      padding: 8px 10px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); font-family: 'Outfit', sans-serif; font-size: .8rem;
      min-width: 0;
    }
    .tf-act-row input { flex: 1; }
    .tf-act-row select { flex: 1; }
    .tf-act-btn {
      padding: 8px 13px; background: transparent;
      border: 1px dashed var(--border); border-radius: 8px;
      color: var(--text-secondary); font-family: 'Outfit', sans-serif;
      font-size: .78rem; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .tf-act-btn:hover { color: var(--accent); border-color: var(--accent); }
    .tf-act-note { font-size: .71rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

    /* ── Yearly overview ────────────────────────────────── */
    .yr-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      width: 1080px; max-width: 96vw; max-height: 88vh;
      display: flex; flex-direction: column;
      transform: translateY(18px) scale(.97);
      transition: transform .25s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .tf-overlay.open .yr-panel { transform: translateY(0) scale(1); }

    .yr-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .yr-nav { display: flex; align-items: center; gap: 10px; }
    .yr-year { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); min-width: 78px; text-align: center; }
    .yr-arrow {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-secondary); font-size: 1.05rem; cursor: pointer; transition: all .15s;
    }
    .yr-arrow:hover { color: var(--accent); border-color: var(--accent); }

    .yr-scroll { overflow: auto; margin-top: 18px; flex: 1; min-height: 0; }
    .yr-table { border-collapse: separate; border-spacing: 0; width: 100%; }
    .yr-table th, .yr-table td { padding: 5px 4px; }
    .yr-table thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--bg-secondary);
      font-size: .66rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted);
      text-align: center; white-space: nowrap;
    }
    .yr-table th.yr-name, .yr-table td.yr-name {
      position: sticky; left: 0; z-index: 1;
      background: var(--bg-secondary);
      text-align: left; min-width: 190px; max-width: 240px;
      font-size: .82rem; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .yr-table thead th.yr-name { z-index: 3; }
    .yr-table tbody tr:hover td { background: var(--bg-card); }
    .yr-table tbody tr:hover td.yr-name { background: var(--bg-card); }
    .yr-table td.yr-name { cursor: pointer; }
    .yr-table td.yr-name:hover { color: var(--accent); }
    .yr-tot { font-size: .72rem; color: var(--text-muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Each cell is split: left half Data, right half Work */
    .yr-cell {
      width: 30px; height: 20px; margin: 0 auto;
      border-radius: 5px; display: flex; overflow: hidden; gap: 1px;
    }
    .yr-half { flex: 1; background: rgba(120,130,145,.22); }
    .yr-half.on { background: var(--success); }
    .yr-cell.na {
      background: transparent;
      border: 1px dashed var(--border);
      box-sizing: border-box;
    }
    .yr-cell.na .yr-half { background: transparent; }
    .yr-cell.future { border-style: dotted; opacity: .5; }
    .yr-cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

    .yr-legend {
      display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px;
      font-size: .72rem; color: var(--text-muted);
      padding-top: 12px; border-top: 1px solid var(--border);
    }
    .yr-key { display: inline-flex; align-items: center; gap: 6px; }
    .yr-hint { color: var(--text-muted); font-size: .84rem; padding: 30px 4px; text-align: center; }

    .task-row { cursor: pointer; }
    .task-row .task-text,
    .task-row .status-btn,
    .task-row .delete-btn,
    .task-row .drag-handle { cursor: auto; }
    .task-row .status-btn,
    .task-row .delete-btn { cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-spacer"></div>
      <div class="header-title">
        <div class="brand-row">
          <img src="/static/favicon.svg" alt="" class="brand-mark">
          <h1>TaskFlow</h1>
        </div>
        <p class="subtitle">Stay organized, stay productive</p>
      </div>
      <nav class="header-nav">
        <div id="themePickerWrap"></div>
        <button class="nav-btn" onclick="openYearView()" title="Yıllık görünüm"
                style="cursor:pointer">&#128197; Yıllık</button>
        <a href="/daily" class="nav-btn" title="Günlük İş Takibi">
          <span class="nav-dot"></span> Günlük Takip
        </a>
      </nav>
    </header>

    <div class="month-nav-bar">
      <button class="month-nav-btn" id="prevMonthBtn" onclick="prevMonth()">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="month-nav-btn" id="nextMonthBtn" onclick="nextMonth()">&#8250;</button>
    </div>

    <div class="input-section" id="inputSection">
      <input type="text" id="taskInput" placeholder="What needs to be done?" onkeypress="handleKeyPress(event)">
      <button class="btn-primary" onclick="addTask()">
        <span>✦</span> Add Task
      </button>
      <button class="btn-secondary" id="resetBtn" onclick="resetAll()">Reset All</button>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="totalTasks">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="dataComplete">0</div>
        <div class="stat-label">Data ✓</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="workComplete">0</div>
        <div class="stat-label">Work ✓</div>
      </div>
    </div>

    <div class="column-headers">
      <div class="drag-col"></div>
      <div class="task-col">Task</div>
      <div class="status-col">Data</div>
      <div class="status-col">Work</div>
      <div class="delete-col"></div>
    </div>

    <ul id="taskList"></ul>
  </div>

  <!-- YEARLY OVERVIEW -->
  <div class="tf-overlay" id="yrOverlay" onclick="handleYrOverlayClick(event)">
    <div class="yr-panel">
      <div class="yr-head">
        <div class="yr-nav">
          <button class="yr-arrow" onclick="yearPrev()">&#8249;</button>
          <span class="yr-year" id="yrYear"></span>
          <button class="yr-arrow" onclick="yearNext()">&#8250;</button>
        </div>
        <div class="yr-tot" id="yrSummary"></div>
      </div>
      <div class="yr-scroll" id="yrScroll"></div>
      <div class="yr-legend">
        <span class="yr-key"><span class="yr-cell"><span class="yr-half on"></span><span class="yr-half on"></span></span> Data + Work</span>
        <span class="yr-key"><span class="yr-cell"><span class="yr-half on"></span><span class="yr-half"></span></span> Yalnızca biri</span>
        <span class="yr-key"><span class="yr-cell"><span class="yr-half"></span><span class="yr-half"></span></span> Yapılmadı</span>
        <span class="yr-key"><span class="yr-cell na"></span> Görev o ay listede değil (sayılmaz)</span>
      </div>
      <div class="tf-foot"><button class="tf-close" onclick="closeYearView()">Kapat</button></div>
    </div>
  </div>

  <!-- TASK HISTORY PANEL -->
  <div class="tf-overlay" id="tfOverlay" onclick="handleTfOverlayClick(event)">
    <div class="tf-panel">
      <div class="tf-title" id="tfTitle"></div>
      <div class="tf-sum" id="tfSum"></div>
      <div class="tf-sec">Aylara göre geçmiş</div>
      <div class="tf-scroll"><div id="tfRows"></div></div>
      <div class="tf-acts" id="tfActs"></div>
      <div class="tf-foot"><button class="tf-close" onclick="closeTaskHistory()">Kapat</button></div>
    </div>
  </div>

  <script>
    let draggedItem = null;
    let draggedId = null;

    const TODAY_MONTH = new Date().toISOString().slice(0, 7);
    let currentMonth = TODAY_MONTH;

    const MONTH_NAMES = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December'
    ];

    function formatMonthLabel(ym) {
      const [year, month] = ym.split('-');
      return `${MONTH_NAMES[parseInt(month) - 1]} ${year}`;
    }

    function updateMonthUI() {
      document.getElementById('monthLabel').textContent = formatMonthLabel(currentMonth);
      document.getElementById('nextMonthBtn').disabled = currentMonth >= TODAY_MONTH;
    }

    async function prevMonth() {
      const [y, m] = currentMonth.split('-').map(Number);
      const d = new Date(y, m - 2, 1);
      currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      updateMonthUI();
      await loadTasks();
    }

    async function nextMonth() {
      if (currentMonth >= TODAY_MONTH) return;
      const [y, m] = currentMonth.split('-').map(Number);
      const d = new Date(y, m, 1);
      currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      updateMonthUI();
      await loadTasks();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') addTask();
    }

    function updateStats(tasks) {
      document.getElementById('totalTasks').textContent = tasks.length;
      document.getElementById('dataComplete').textContent = tasks.filter(t => t.data_status === "☑").length;
      document.getElementById('workComplete').textContent = tasks.filter(t => t.work_status === "☑").length;
    }

    async function loadTasks() {
      const res = await fetch(`/tasks?month=${currentMonth}`);
      const tasks = await res.json();
      const list = document.getElementById("taskList");

      updateStats(tasks);

      if (tasks.length === 0) {
        list.innerHTML = `
          <li>
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <div class="empty-state-text">No tasks yet. Add one above!</div>
            </div>
          </li>
        `;
        return;
      }

      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.setAttribute("data-id", task.id);
        li.setAttribute("draggable", "true");
        li.className = "task-item";
        li.innerHTML = `
          <div class="task-row" style="animation-delay: ${index * 0.05}s"
               onclick="openTaskHistory('${encodeURIComponent(task.key)}')"
               title="Geçmişi gör">
            <div class="drag-handle" title="Drag to reorder" onclick="event.stopPropagation()">⋮⋮</div>
            <input type="text" class="task-text" value="${escapeHtml(task.text)}"
                   data-orig="${escapeHtml(task.text)}"
                   onclick="event.stopPropagation()"
                   onchange="editTask(this)">
            <div class="status-group">
              <button class="status-btn ${task.data_status === "☑" ? 'active' : ''}" onclick="event.stopPropagation(); toggleStatus(${task.id}, 'data', this)" title="Data Status">
                ${task.data_status === "☑" ? '✓' : ''}
              </button>
            </div>
            <div class="status-group">
              <button class="status-btn ${task.work_status === "☑" ? 'active' : ''}" onclick="event.stopPropagation(); toggleStatus(${task.id}, 'work', this)" title="Work Status">
                ${task.work_status === "☑" ? '✓' : ''}
              </button>
            </div>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})" title="Delete Task">✕</button>
          </div>
        `;
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragend', handleDragEnd);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('dragenter', handleDragEnter);
        li.addEventListener('dragleave', handleDragLeave);
        li.addEventListener('drop', handleDrop);
        list.appendChild(li);
      });
    }

    // Drag and Drop handlers
    function handleDragStart(e) {
      draggedItem = this;
      draggedId = this.getAttribute('data-id');
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
      setTimeout(() => { this.style.opacity = '0.4'; }, 0);
    }

    function handleDragEnd(e) {
      this.classList.remove('dragging');
      this.style.opacity = '1';
      document.querySelectorAll('.task-item').forEach(item => {
        item.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
      });
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = this.getBoundingClientRect();
      const midpoint = rect.top + rect.height / 2;
      this.classList.remove('drag-over-top', 'drag-over-bottom');
      if (e.clientY < midpoint) {
        this.classList.add('drag-over-top');
      } else {
        this.classList.add('drag-over-bottom');
      }
    }

    function handleDragEnter(e) {
      e.preventDefault();
      if (this !== draggedItem) this.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      this.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
    }

    async function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      if (this === draggedItem) return;

      const list = document.getElementById('taskList');
      const rect = this.getBoundingClientRect();
      const insertBefore = e.clientY < rect.top + rect.height / 2;

      if (insertBefore) {
        list.insertBefore(draggedItem, this);
      } else {
        list.insertBefore(draggedItem, this.nextSibling);
      }

      const newOrder = [...list.querySelectorAll('.task-item')].map(item =>
        parseInt(item.getAttribute('data-id'))
      );

      await fetch('/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: newOrder })
      });

      this.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function addTask() {
      const input = document.getElementById("taskInput");
      const task = input.value.trim();
      if (!task) return;

      const res = await fetch("/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, month: currentMonth })
      });
      const data = await res.json();
      if (data.success) {
        input.value = "";
        loadTasks();
      }
    }

    // Title is identity, so renaming re-identifies the task and applies to
    // every month it runs in — matching the daily page. Renaming only from
    // a point forward is a split, offered in the history panel.
    async function editTask(el) {
      const oldText = el.dataset.orig;
      const newText = el.value.trim();
      if (!newText || newText === oldText) { el.value = oldText; return; }

      const { count } = await (await fetch(
        `/task-count?text=${encodeURIComponent(oldText)}`)).json();
      if (count > 1) {
        const ok = confirm(
          `"${oldText}" gorevinin ${count} ayindaki kaydi "${newText}" olarak degisecek.\n\n` +
          `Yalnizca bu aydan itibaren degistirmek istiyorsan, gecmis panelinden "ayir" kullan.\n\n` +
          `Devam edilsin mi?`);
        if (!ok) { el.value = oldText; return; }
      }

      await fetch('/task-rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_text: oldText, new_text: newText }),
      });
      el.dataset.orig = newText;
      await loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/delete/${id}`, { method: "POST" });
      loadTasks();
    }

    async function toggleStatus(id, column, button) {
      await fetch(`/toggle/${id}/${column}`, { method: "POST" });
      const isActive = button.classList.contains('active');
      if (isActive) {
        button.classList.remove('active');
        button.textContent = '';
      } else {
        button.classList.add('active');
        button.textContent = '✓';
      }
      const res = await fetch(`/tasks?month=${currentMonth}`);
      const tasks = await res.json();
      updateStats(tasks);
    }

    async function resetAll() {
      if (confirm('Reset all task statuses? This will uncheck all tasks.')) {
        await fetch("/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ month: currentMonth })
        });
        loadTasks();
      }
    }

    // ── Yearly overview ───────────────────────────────────
    // A task removed part-way through the year stays on the table but
    // stops counting once it is gone; months it never existed in, and
    // months that were never opened, are likewise not counted.
    let yrYear = new Date().getFullYear();

    const YR_LABEL = {
      done:      'Data + Work tamamlandı',
      partial:   'Yalnızca biri tamamlandı',
      none:      'Yapılmadı',
      after:     'Görev bu aydan önce listeden çıkarılmış — sayılmıyor',
      before:    'Görev bu ayda henüz yoktu — sayılmıyor',
      gap:       'Görev bu ay listede değildi — sayılmıyor',
      untracked: 'Bu ay hiç açılmamış — veri yok',
      future:    'Gelecek ay',
    };

    function openYearView() {
      document.getElementById('yrOverlay').classList.add('open');
      yrYear = parseInt(currentMonth.slice(0, 4), 10);
      loadYearView();
    }
    function closeYearView() { document.getElementById('yrOverlay').classList.remove('open'); }
    function handleYrOverlayClick(e) {
      if (e.target === document.getElementById('yrOverlay')) closeYearView();
    }
    function yearPrev() { yrYear--; loadYearView(); }
    function yearNext() { yrYear++; loadYearView(); }

    async function loadYearView() {
      document.getElementById('yrYear').textContent = yrYear;
      document.getElementById('yrScroll').innerHTML = '<div class="yr-hint">Yükleniyor…</div>';

      const res = await fetch(`/year-overview?year=${yrYear}`);
      const ov = await res.json();

      if (!ov.tasks.length) {
        document.getElementById('yrScroll').innerHTML =
          '<div class="yr-hint">Bu yıl için kayıt yok.</div>';
        document.getElementById('yrSummary').textContent = '';
        return;
      }

      const totActive = ov.tasks.reduce((s, t) => s + t.active, 0);
      const totBoth   = ov.tasks.reduce((s, t) => s + t.both, 0);
      document.getElementById('yrSummary').innerHTML =
        `<strong>${ov.tasks.length}</strong> görev · ${totBoth}/${totActive} ay tamamlandı`;

      const head = ov.months.map(m =>
        `<th>${MONTH_NAMES[parseInt(m.slice(5), 10) - 1].slice(0, 3)}</th>`).join('');

      const body = ov.tasks.map(t => {
        const cells = t.cells.map(c => {
          const applies = ['done', 'partial', 'none'].includes(c.state);
          const cls = applies
            ? 'yr-cell'
            : 'yr-cell na' + (c.state === 'future' ? ' future' : '');
          const cur = c.m === ov.current_month ? ' cur' : '';
          const halves = applies
            ? `<span class="yr-half${c.data ? ' on' : ''}"></span><span class="yr-half${c.work ? ' on' : ''}"></span>`
            : '';
          return `<td title="${escapeHtml(YR_LABEL[c.state] || c.state)}">
                    <span class="${cls}${cur}">${halves}</span></td>`;
        }).join('');
        return `<tr>
            <td class="yr-name" title="${escapeHtml(t.text)}"
                onclick="openTaskHistory('${encodeURIComponent(t.key)}')">${escapeHtml(t.text)}</td>
            ${cells}
            <td class="yr-tot">${t.both}/${t.active}</td>
          </tr>`;
      }).join('');

      document.getElementById('yrScroll').innerHTML = `
        <table class="yr-table">
          <thead><tr><th class="yr-name">Görev</th>${head}<th class="yr-tot">Toplam</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    // ── Task history ──────────────────────────────────────
    // Tasks are linked by their normalized title, so a task that recurs
    // month after month reads as one thing with a history. The key is
    // computed server-side and arrives with each task.
    let tfCurrent = { key: null, text: '', months: [] };

    function fmtMonth(ym) {
      const [y, m] = ym.split('-');
      return `${MONTH_NAMES[parseInt(m, 10) - 1]} ${y}`;
    }

    async function openTaskHistory(encKey) {
      const key = decodeURIComponent(encKey);
      document.getElementById('tfOverlay').classList.add('open');
      document.getElementById('tfRows').innerHTML = '<div class="tf-hint">Yükleniyor…</div>';

      const res = await fetch(`/task-history?key=${encodeURIComponent(key)}`);
      const { summary, months } = await res.json();

      tfCurrent = { key, text: months.length ? months[0].text : '', months };
      document.getElementById('tfTitle').textContent = tfCurrent.text;
      document.getElementById('tfSum').innerHTML = summary.months
        ? `<strong>${summary.months}</strong> ay · Data <strong>${summary.data_done}</strong> ·
           Work <strong>${summary.work_done}</strong> · İkisi de <strong>${summary.both_done}</strong>
           ${summary.first_month ? '· ' + fmtMonth(summary.first_month) + ' – ' + fmtMonth(summary.last_month) : ''}`
        : 'Kayıt yok';

      document.getElementById('tfRows').innerHTML = months.map(m => `
        <div class="tf-row${m.month === currentMonth ? ' current' : ''}"
             onclick="jumpToMonth('${m.month}')" title="Bu aya git">
          <span class="tf-month">${fmtMonth(m.month)}</span>
          <span class="tf-flags">
            <span class="tf-flag${m.data_done ? ' on' : ''}">${m.data_done ? '✓' : '○'} Data</span>
            <span class="tf-flag${m.work_done ? ' on' : ''}">${m.work_done ? '✓' : '○'} Work</span>
          </span>
        </div>`).join('') || '<div class="tf-hint">Kayıt yok.</div>';

      renderTaskActions();
    }

    // Entity-level actions live here rather than on the row, since they
    // affect the task across months rather than this month's record.
    async function renderTaskActions() {
      const el = document.getElementById('tfActs');
      if (!tfCurrent.months.length) { el.innerHTML = ''; return; }

      const others = (await (await fetch('/task-entities')).json())
        .filter(e => e.key !== tfCurrent.key);

      el.innerHTML = `
        <div class="tf-sec">İşlemler</div>
        <div class="tf-act-row">
          <select id="tfSplitMonth">
            ${tfCurrent.months.map(m =>
              `<option value="${m.id}"${m.month === currentMonth ? ' selected' : ''}>${fmtMonth(m.month)}</option>`
            ).join('')}
          </select>
          <input id="tfSplitName" placeholder="Yeni ad" />
          <button class="tf-act-btn" onclick="doSplitForward()">Bu aydan itibaren ayır</button>
        </div>
        <div class="tf-act-row">
          <select id="tfMergeTarget">
            ${others.length
              ? others.map(e => `<option value="${encodeURIComponent(e.key)}">${escapeHtml(e.text)} (${e.months} ay)</option>`).join('')
              : '<option value="">Başka görev yok</option>'}
          </select>
          <button class="tf-act-btn" onclick="doMergeTask()">Birleştir</button>
        </div>
        <div class="tf-act-note">
          Adı doğrudan değiştirmek tüm ayları etkiler. Yalnızca bir aydan
          sonrasını değiştirmek için “ayır”ı kullan.
        </div>`;
    }

    async function doSplitForward() {
      const id = document.getElementById('tfSplitMonth').value;
      const name = document.getElementById('tfSplitName').value.trim();
      if (!id || !name) { document.getElementById('tfSplitName').focus(); return; }
      const m = tfCurrent.months.find(x => String(x.id) === String(id));
      if (!confirm(`${fmtMonth(m.month)} ve sonrasindaki kayitlar "${name}" adiyla ayrilacak.\n\nDevam edilsin mi?`)) return;

      const res = await fetch(`/task-split/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_text: name, include_later: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (!data.success) { alert('Ayırma başarısız.'); return; }
      closeTaskHistory();
      await loadTasks();
    }

    async function doMergeTask() {
      const enc = document.getElementById('tfMergeTarget').value;
      if (!enc) return;
      const targetKey = decodeURIComponent(enc);
      const all = await (await fetch('/task-entities')).json();
      const target = all.find(e => e.key === targetKey);
      if (!target) return;
      if (!confirm(`"${tfCurrent.text}" gorevinin tum aylari "${target.text}" adiyla birlestirilecek.\n\nDevam edilsin mi?`)) return;

      const res = await fetch('/task-rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_text: tfCurrent.text, new_text: target.text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!data.success) { alert('Birleştirme başarısız.'); return; }
      closeTaskHistory();
      await loadTasks();
    }

    function closeTaskHistory() {
      document.getElementById('tfOverlay').classList.remove('open');
    }

    function handleTfOverlayClick(e) {
      if (e.target === document.getElementById('tfOverlay')) closeTaskHistory();
    }

    async function jumpToMonth(ym) {
      currentMonth = ym;
      updateMonthUI();
      closeTaskHistory();
      await loadTasks();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeTaskHistory(); closeYearView(); }
    });

    window.onload = async () => {
      updateMonthUI();
      await loadTasks();
    };
  </script>
  <script src="/static/theme.js"></script>
  <script>
    if (window.AppTheme) AppTheme.mountThemePicker('themePickerWrap');
  </script>
</body>
</html>
